# One-off: draws assets/music.svg with the video thumbnail. Deleted after it runs.
name: music card (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kimjungminn24/cute-readme
          path: .cute-readme
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --input-type=module -e "
          import { readFileSync, writeFileSync } from 'node:fs';
          import { renderMusicCard, thumbnailUrl, youtubeUrl } from './.cute-readme/src/musiccard.js';
          import { readDotFont } from './.cute-readme/src/dotfont.js';
          const id = 'zhHB4dZTChw';
          const meta = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(youtubeUrl(id))).then((r) => r.json()).catch(() => ({}));
          console.log('oembed', JSON.stringify({ title: meta.title, author: meta.author_name }));
          const res = await fetch(thumbnailUrl(id));
          if (!res.ok) throw new Error('thumbnail ' + res.status);
          const cover = 'data:' + (res.headers.get('content-type') ?? 'image/jpeg') + ';base64,' + Buffer.from(await res.arrayBuffer()).toString('base64');
          const dots = readDotFont(readFileSync('.cute-readme/assets/galmuri11.dot'));
          const svg = renderMusicCard({ id, title: meta.title ?? 'now playing', artist: meta.author_name ?? '', cover }, { theme: 'pixel', layout: 'wide', width: 420, dots });
          writeFileSync('assets/music.svg', svg);
          "
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music.svg
          git diff --cached --quiet || { git commit -m "update music card"; git push; }
