<svg xmlns="http://www.w3.org/2000/svg" width="436" height="316" viewBox="0 0 436 316" shape-rendering="crispEdges" role="img" aria-label="miniroom">
  <title>miniroom</title>
  <style>
  .fx-bob { animation: bob 2.4s steps(3) infinite; animation-delay: var(--bob-delay, 0s); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) {
  .fx-bob { animation: none; }
  }

  .wy { animation-name: wfall; animation-timing-function: linear; animation-iteration-count: infinite; }
  .wx { animation-name: wsway; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; }
  @keyframes wfall {
    from { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    85% { opacity: 1; }
    to { transform: translateY(340px); opacity: 0; }
  }
  @keyframes wsway { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
  @media (prefers-reduced-motion: reduce) { .wy, .wx { animation: none; } }</style>
